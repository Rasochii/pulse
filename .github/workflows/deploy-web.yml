# Publica a versão web (PWA) no GitHub Pages.
#
# Configure uma vez em Settings › Secrets and variables › Actions:
#   Variables: SUPABASE_URL, GOOGLE_WEB_CLIENT_ID (opcional)
#   Secrets:   SUPABASE_ANON_KEY (a chave anon/publishable — nunca a service_role)
# E em Settings › Pages, escolha "GitHub Actions" como fonte.
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      # Os testes de repositório abrem um SQLite em memória.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter test

      # Os valores ficam embutidos no JavaScript publicado; por isso só chaves públicas.
      - name: Build web
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
